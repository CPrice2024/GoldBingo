<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <!-- ========================================
       MOBILE
  ========================================= -->

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#D4A72C"
  />

  <meta
    name="color-scheme"
    content="dark"
  />


  <!-- ========================================
       BRANDING
  ========================================= -->

  <title>
    Gold Online Bingo | Play Bingo Online
  </title>

  <meta
    name="description"
    content="Gold Online Bingo is an online Bingo platform where players can join live Bingo games, select cards, follow called numbers, and enjoy real-time gameplay."
  />

  <meta
    name="application-name"
    content="Gold Online Bingo"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="Gold Online Bingo"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />


  <!-- ========================================
       CANONICAL
  ========================================= -->

  <link
    rel="canonical"
    href="https://goldbingo.org/"
  />


  <!-- ========================================
       FAVICONS
  ========================================= -->

  <link
    rel="icon"
    href="/favicon.ico"
    sizes="any"
  />

  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16x16.png"
  />


  <!-- ========================================
       APPLE ICON
  ========================================= -->

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png"
  />


  <!-- ========================================
       PWA MANIFEST
  ========================================= -->

  <link
    rel="manifest"
    href="/site.webmanifest"
  />


  <!-- ========================================
       OPEN GRAPH / SOCIAL SHARE
  ========================================= -->

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:site_name"
    content="Gold Online Bingo"
  />

  <meta
    property="og:title"
    content="Gold Online Bingo | Play Bingo Online"
  />

  <meta
    property="og:description"
    content="Join live Bingo games, select your cards, follow called numbers, and play in real time with Gold Bingo."
  />

  <meta
    property="og:url"
    content="https://goldbingo.org/"
  />

  <meta
    property="og:image"
    content="https://goldbingo.org/og-image.png"
  />

  <meta
    property="og:image:width"
    content="1200"
  />

  <meta
    property="og:image:height"
    content="630"
  />

  <meta
    property="og:image:alt"
    content="GoldBingo"
  />


  <!-- ========================================
       TWITTER / X
  ========================================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="GoldBingo | Play Bingo Online"
  />

  <meta
    name="twitter:description"
    content="Join live Bingo games and enjoy real-time Bingo gameplay with GoldBingo."
  />

  <meta
    name="twitter:image"
    content="https://goldbingo.org/og-image.png"
  />

</head>


<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
